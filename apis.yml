name: ReelData AI
description: >-
  ReelData AI builds artificial intelligence software for land-based aquaculture,
  helping recirculating aquaculture system (RAS) fish farms maximize growth,
  minimize costs, and reduce risk across smolt, post-smolt, and on-growing
  production. Its integrated AI suite includes AI Smart Feeding (ReelAppetite),
  which monitors real-time population appetite to optimize feed and cut waste;
  AI Biomass Monitoring (ReelWeight), a non-intrusive biomass estimation tool
  returning results within hours; and AI Cameras (ReelVision), dual-function
  cameras for fish-behavior monitoring, feed counting, and standard IP camera
  use. Additional tools cover stress monitoring (ReelStress) and early disease
  detection (ReelHealth). ReelData is a Techstars portfolio company serving major
  operators including Samherji, Atlantic Sapphire, Kingfish Company, and Salmon
  Evolution. As of this enrichment pass the company exposes no public developer
  portal, API, or SDK surface; its products are delivered as on-site AI hardware
  and software rather than a self-serve API.
